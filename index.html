<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="五金记账">
<title>五金记账 · 店铺内部账本</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f1f3f7;--panel:#fff;--panel2:#f8fafc;
  --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;
  --line:#e6e9ef;--line2:#eef1f6;
  --nav:#141a24;--nav2:#1d2532;--navink:#94a3b8;
  --brand:#f59e0b;--brand2:#d97706;--brandbg:#fff7e8;
  --in:#059669;--inbg:#e9f8f2;
  --out:#dc2626;--outbg:#fdecec;
  --blue:#2563eb;--bluebg:#eaf0fe;
  --purple:#7c3aed;--purplebg:#f2ecfe;
  --r:14px;--rs:10px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
  --sh2:0 8px 32px rgba(16,24,40,.14);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== layout ===== */
#app{display:flex;min-height:100vh}
#side{
  width:238px;flex:0 0 238px;background:var(--nav);color:#e2e8f0;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--brand),#ea580c);
  display:grid;place-items:center;font-size:19px;flex:0 0 38px;box-shadow:0 4px 12px rgba(245,158,11,.35)}
.brand b{display:block;font-size:15.5px;color:#fff;letter-spacing:.4px}
.brand span{display:block;font-size:11px;color:#64748b;margin-top:1px}
.nav{padding:6px 10px;overflow-y:auto;flex:1}
.navgroup{font-size:10.5px;color:#5b6675;letter-spacing:1.4px;padding:16px 10px 7px;font-weight:700}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;cursor:pointer;
  color:var(--navink);font-size:13.5px;margin-bottom:2px;transition:.15s;position:relative;user-select:none}
.navitem:hover{background:var(--nav2);color:#e2e8f0}
.navitem.on{background:linear-gradient(90deg,rgba(245,158,11,.18),rgba(245,158,11,.06));color:#fbbf24;font-weight:600}
.navitem.on:before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;background:var(--brand);border-radius:0 3px 3px 0}
.navitem svg{width:18px;height:18px;flex:0 0 18px;stroke-width:1.9}
.navitem .dot{margin-left:auto;background:var(--out);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700}
.sidefoot{padding:12px 18px 16px;border-top:1px solid #232c3a;font-size:11px;color:#5b6675}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:14px;min-height:62px
}
#top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
#top .sub{font-size:12px;color:var(--ink3);margin-top:1px}
#top .spacer{flex:1}
#view{padding:22px 26px 40px;flex:1}

#tabs{display:none}

@media(max-width:920px){
  #side{display:none}
  #top{padding:11px 15px;min-height:56px}
  #top h1{font-size:16px}
  #view{padding:14px 13px 92px}
  #tabs{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;cursor:pointer;
    color:var(--ink3);font-size:10.5px;border-radius:9px;user-select:none}
  .tab svg{width:21px;height:21px;stroke-width:1.9}
  .tab.on{color:var(--brand2);font-weight:700}
  .tab.mid{position:relative}
  .tab.mid .fab{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--brand),#ea580c);
    display:grid;place-items:center;color:#fff;margin-top:-16px;box-shadow:0 6px 16px rgba(234,88,12,.4)}
  .tab.mid .fab svg{width:23px;height:23px;stroke-width:2.4}
}

/* ===== atoms ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:700}
.card-h .sub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.card-h .spacer{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:1.9fr 1fr}
.g-1-2{grid-template-columns:1fr 1.9fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g-2-1,.g-1-2{grid-template-columns:1fr}}
@media(max-width:640px){.g3,.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.g3,.g2,.g4{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:9px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.muted{color:var(--ink3)}
.small{font-size:12px}
.tiny{font-size:11px}
.bold{font-weight:700}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--in)}.neg{color:var(--out)}
.hide{display:none!important}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2);transition:.15s;white-space:nowrap;user-select:none
}
.btn:hover{border-color:#cbd5e1;background:var(--panel2);color:var(--ink)}
.btn:active{transform:scale(.975)}
.btn svg{width:16px;height:16px;stroke-width:2.1}
.btn.pri{background:linear-gradient(140deg,var(--brand),#ea8c0a);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(234,140,10,.3)}
.btn.pri:hover{filter:brightness(1.06);background:linear-gradient(140deg,var(--brand),#ea8c0a);color:#fff}
.btn.dark{background:var(--nav);border-color:transparent;color:#fff}
.btn.dark:hover{background:var(--nav2);color:#fff}
.btn.danger{color:var(--out);border-color:#f6d4d4}
.btn.danger:hover{background:var(--outbg);border-color:#eeb9b9;color:var(--out)}
.btn.green{background:var(--in);border-color:transparent;color:#fff}
.btn.green:hover{background:#047857;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.sm svg{width:13px;height:13px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink3);transition:.15s;flex:0 0 32px}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px;stroke-width:2}
.iconbtn.danger:hover{background:var(--outbg);color:var(--out)}

.field{margin-bottom:13px}
.field>label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field>label .req{color:var(--out)}
.inp{
  width:100%;padding:9.5px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
  outline:none;transition:.15s;font-size:14px
}
.inp:hover{border-color:#d3dae4}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(245,158,11,.14)}
.inp::placeholder{color:#b6bfcc}
textarea.inp{resize:vertical;min-height:66px;line-height:1.5}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;cursor:pointer}
.inp.err{border-color:var(--out);box-shadow:0 0 0 3.5px rgba(220,38,38,.1)}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6.5px 14px;border-radius:8px;cursor:pointer;font-size:13px;
  color:var(--ink2);font-weight:600;transition:.15s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.11)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5.5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;
  font-size:12.5px;color:var(--ink2);transition:.15s;user-select:none;font-weight:500}
.chip:hover{border-color:#cbd5e1}
.chip.on{background:var(--brandbg);border-color:var(--brand);color:var(--brand2);font-weight:700}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.in{background:var(--inbg);color:var(--in)}
.badge.out{background:var(--outbg);color:var(--out)}
.badge.blue{background:var(--bluebg);color:var(--blue)}
.badge.amber{background:var(--brandbg);color:var(--brand2)}
.badge.purple{background:var(--purplebg);color:var(--purple)}
.badge.gray{background:var(--line2);color:var(--ink2)}

table.tb{width:100%;border-collapse:collapse}
.tb th{font-size:11.5px;color:var(--ink3);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);
  background:var(--panel2);white-space:nowrap;letter-spacing:.3px}
.tb td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr:hover{background:#fcfdfe}
.tb .r{text-align:right}
.tb .c{text-align:center}
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.13s}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel2)}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px;font-size:15px}
.li .body{flex:1;min-width:0}
.li .t{font-size:13.5px;font-weight:600}
.li .d{font-size:11.5px;color:var(--ink3);margin-top:1.5px}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--c,var(--brand))}
.kpi .lb{font-size:12px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .lb svg{width:14px;height:14px;stroke-width:2.1}
.kpi .vl{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:5px;line-height:1.15}
.kpi .ft{font-size:11.5px;color:var(--ink3);margin-top:5px;display:flex;align-items:center;gap:4px}
@media(max-width:640px){.kpi{padding:12px 13px}.kpi .vl{font-size:19px}}

.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty .e{font-size:38px;opacity:.5;margin-bottom:9px}
.empty .t{font-size:13.5px;font-weight:600;color:var(--ink2)}
.empty .d{font-size:12px;margin-top:4px}

/* modal */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.44);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto}
#mask.on{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:520px;box-shadow:var(--sh2);
  animation:pop .2s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.sheet.wide{max-width:800px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.sheet-h{padding:17px 20px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.sheet-h h3{margin:0;font-size:16px;font-weight:700;flex:1}
.sheet-b{padding:18px 20px;max-height:calc(100vh - 210px);overflow-y:auto}
.sheet-f{padding:13px 20px 17px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line2)}
@media(max-width:640px){
  #mask{padding:0;align-items:flex-end}
  .sheet{max-width:none;border-radius:20px 20px 0 0;animation:up .26s cubic-bezier(.2,.9,.3,1)}
  .sheet-b{max-height:calc(100vh - 150px)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
}

#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tt{background:rgba(15,23,42,.93);color:#fff;padding:10px 18px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.24);animation:tin .22s;display:flex;align-items:center;gap:8px;max-width:88vw}
.tt svg{width:16px;height:16px;stroke-width:2.4;flex:0 0 16px}
.tt.ok svg{color:#34d399}.tt.err svg{color:#f87171}.tt.warn svg{color:#fbbf24}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* picker */
.picker{position:relative}
.picker-res{position:absolute;left:0;right:0;top:calc(100% + 5px);background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh2);max-height:290px;overflow-y:auto;z-index:20;display:none}
.picker-res.on{display:block}
.pk{padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;align-items:center;gap:10px}
.pk:last-child{border-bottom:0}
.pk:hover,.pk.hi{background:var(--brandbg)}
.pk .n{font-size:13.5px;font-weight:600}
.pk .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
.pk .p{margin-left:auto;text-align:right}

/* sale items */
.items{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2);background:#fff}
.it:last-child{border-bottom:0}
.it .info{flex:1;min-width:0}
.it .nm{font-size:13.5px;font-weight:600}
.it .sp{font-size:11px;color:var(--ink3);margin-top:1px}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.qty button{width:29px;height:29px;border:0;background:var(--panel2);cursor:pointer;color:var(--ink2);
  display:grid;place-items:center;font-size:16px;line-height:1;padding:0}
.qty button:active{background:var(--line)}
.qty input{width:44px;height:29px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  text-align:center;outline:none;font-size:13.5px;font-weight:600;padding:0;background:#fff}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.it .amt{width:82px;text-align:right;font-weight:700;font-size:13.5px;flex:0 0 82px}
@media(max-width:640px){.it{flex-wrap:wrap}.it .amt{width:auto;flex:1}}

.total-box{background:linear-gradient(140deg,#1b2431,#141a24);border-radius:14px;padding:15px 17px;color:#e2e8f0}
.total-box .ln{display:flex;justify-content:space-between;align-items:center;padding:3.5px 0;font-size:13px}
.total-box .ln .k{color:#94a3b8}
.total-box .ln.big{border-top:1px dashed #334052;margin-top:8px;padding-top:11px}
.total-box .ln.big .k{color:#e2e8f0;font-size:14px;font-weight:600}
.total-box .ln.big .v{font-size:25px;font-weight:800;color:var(--brand);letter-spacing:-.5px}

/* stat rows */
.srow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}
.srow .bar{height:7px;border-radius:5px;background:var(--brand);min-width:2px}
.srow .track{flex:1;height:7px;background:var(--line2);border-radius:5px;overflow:hidden;min-width:40px}

.prog{height:6px;background:var(--line2);border-radius:5px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:5px;background:var(--brand)}

.alert{display:flex;gap:10px;padding:11px 13px;border-radius:11px;font-size:12.8px;align-items:flex-start;line-height:1.5}
.alert svg{width:16px;height:16px;flex:0 0 16px;margin-top:1.5px;stroke-width:2.1}
.alert.warn{background:var(--brandbg);color:#92610a}
.alert.danger{background:var(--outbg);color:#991b1b}
.alert.info{background:var(--bluebg);color:#1e40af}
.alert.ok{background:var(--inbg);color:#065f46}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:170px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3);stroke-width:2.2;pointer-events:none}
.search .inp{padding-left:34px}

.fab-float{position:fixed;right:18px;bottom:88px;z-index:45;width:54px;height:54px;border-radius:18px;
  background:linear-gradient(140deg,var(--brand),#ea580c);color:#fff;display:none;place-items:center;
  box-shadow:0 8px 22px rgba(234,88,12,.42);cursor:pointer;border:0}
.fab-float svg{width:25px;height:25px;stroke-width:2.5}
@media(max-width:920px){.fab-float.on{display:grid}}

#printArea{display:none}
#vmic{position:fixed;right:22px;bottom:22px;z-index:120;width:48px;height:48px;border-radius:50%;
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh2);display:none;place-items:center;
  color:var(--ink2);cursor:pointer}
#vmic svg{width:21px;height:21px;stroke-width:2}
#vmic.on{display:grid}
#vmic.rec{background:var(--out);border-color:transparent;color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
@media(max-width:920px){#vmic{right:16px;bottom:152px}}
.vbig{width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;margin:4px auto 0;
  background:linear-gradient(140deg,var(--brand),#ea580c);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(234,88,12,.4)}

const ico=(n,extra)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'>'+(ICON[n]||'')+'</svg>';

/* ---------- 常量 ---------- */
const KEY='wujin_book_v1';
const CAT_IN=['商品销售','服务收入','安装维修','收欠款','其他收入'];
const CAT_OUT=['进货采购','房租水电','员工工资','运输物流','零星采购','工具耗材','广告宣传','招待费用','维修维护','税费手续费','付欠款','其他支出'];
const OPEX_CATS=['房租水电','员工工资','运输物流','零星采购','工具耗材','广告宣传','招待费用','维修维护','税费手续费','其他支出'];
const METHODS=['现金','微信','支付宝','银行卡','对公转账','赊账'];
const PCATS=['手动工具','电动工具','螺丝紧固','水暖管件','电工电料','油漆涂料','焊接材料','劳保用品','门窗五金','胶类耗材','杂项'];
const UNITS=['个','把','盒','根','米','卷','包','套','件','台','瓶','张','只','条','支','桶','袋','公斤'];
const PAL=['#f59e0b','#2563eb','#059669','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0d9488','#9333ea','#64748b'];

const NAV=[
  {g:'日常经营'},
  {k:'dash',t:'经营看板',i:'home'},
  {k:'sale',t:'销售开单',i:'cart'},

const TITLES={dash:'经营看板',sale:'销售开单',quick:'快速记账',purchase:'进货入库',bills:'单据流水',debts:'应收应付',report:'统计报表',products:'商品库存',settings:'设置备份'};

/* ---------- 数据层 ---------- */
const DB={
  d:null,
  blank(){return{v:1,meta:{shop:'鑫源五金',owner:'',phone:'',addr:'',ticket:'谢谢惠顾，欢迎再次光临！'},products:[],sales:[],purchases:[],txns:[],debts:[]}},
  load(){
    let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
    try{this.d=raw?JSON.parse(raw):null}catch(e){this.d=null}
    if(!this.d||typeof this.d!=='object'||Array.isArray(this.d))this.d=this.blank();
    const b=this.blank();
    for(const k in b)if(this.d[k]===undefined||this.d[k]===null)this.d[k]=b[k];
    this.d.meta=Object.assign({},b.meta,this.d.meta||{});
    ['products','sales','purchases','txns','debts'].forEach(k=>{if(!Array.isArray(this.d[k]))this.d[k]=[]});
    if(this.d.pyfix!==2){this.d.products.forEach(p=>{p.py=pinyin(p.name)});this.d.pyfix=2;try{localStorage.setItem(KEY,JSON.stringify(this.d))}catch(e){}}
    return this.d;
  },
  save(){try{localStorage.setItem(KEY,JSON.stringify(this.d));return true}catch(e){toast('保存失败，浏览器存储空间可能已满','err');return false}},
  size(){try{return (localStorage.getItem(KEY)||'').length}catch(e){return 0}}
};
const D=()=>DB.d;
const P=()=>DB.d.products;

/* ---------- 计算 ---------- */
const saleOwed=s=>r2(num(s.net)-num(s.paid));
const purOwed=p=>r2(num(p.total)-num(p.paid));
const debtBal=d=>r2(sum(d.records||[],r=>num(r.delta)));
const prodMargin=p=>num(p.price)>0?r2((num(p.price)-num(p.cost))/num(p.price)*100):0;
const stockValue=()=>r2(sum(P(),p=>num(p.stock)*num(p.cost)));
const retailValue=()=>r2(sum(P(),p=>num(p.stock)*num(p.price)));
const lowStock=()=>P().filter(p=>num(p.stock)<=num(p.minStock||0));

function arItems(){
  const out=[];
  D().sales.forEach(s=>{const o=saleOwed(s);if(o>0.009)out.push({kind:'sale',id:s.id,no:s.no,party:(s.customer||'').trim()||'散客',date:s.date,owed:o,base:num(s.net),desc:'销售单 '+s.no})});
  D().debts.filter(d=>d.type==='ar').forEach(d=>{const b=debtBal(d);if(b>0.009)out.push({kind:'debt',id:d.id,no:'',party:d.name,date:d.date,owed:b,base:b,desc:d.note||'历史欠款'})});
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
function apItems(){
  const out=[];
  D().purchases.forEach(p=>{const o=purOwed(p);if(o>0.009)out.push({kind:'pur',id:p.id,no:p.no,party:(p.supplier||'').trim()||'未填供应商',date:p.date,owed:o,base:num(p.total),desc:'进货单 '+p.no})});
  D().debts.filter(d=>d.type==='ap').forEach(d=>{const b=debtBal(d);if(b>0.009)out.push({kind:'debt',id:d.id,no:'',party:d.name,date:d.date,owed:b,base:b,desc:d.note||'历史欠款'})});
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
function partySum(type){
  const list=type==='ar'?arItems():apItems();
  const m={};
  list.forEach(x=>{const k=x.party;(m[k]=m[k]||{party:k,amount:0,items:[],oldest:x.date});m[k].amount=r2(m[k].amount+x.owed);m[k].items.push(x);if(x.date<m[k].oldest)m[k].oldest=x.date});
  return Object.values(m).sort(byDesc(v=>v.amount));
}
const arTotal=()=>r2(sum(arItems(),x=>x.owed));
const apTotal=()=>r2(sum(apItems(),x=>x.owed));
const cashBalance=()=>r2(sum(D().txns.filter(x=>x.type==='in'),x=>x.amount)-sum(D().txns.filter(x=>x.type==='out'),x=>x.amount));

/* 损益（权责口径）+ 现金流（收付口径） */
function PL(from,to){
  const s=D().sales.filter(x=>x.date>=from&&x.date<=to);
  const p=D().purchases.filter(x=>x.date>=from&&x.date<=to);
  const t=D().txns.filter(x=>x.date>=from&&x.date<=to);
  const saleRev=rsum(s,x=>x.net);
  const otherRev=rsum(t.filter(x=>x.type==='in'&&x.pnl==='rev'),x=>x.amount);
  const rev=r2(saleRev+otherRev);
  const cogs=rsum(s,x=>x.cost);
  const gross=r2(rev-cogs);
  const opexT=t.filter(x=>x.type==='out'&&x.pnl==='opex');
  const opex=rsum(opexT,x=>x.amount);
  const cashIn=rsum(t.filter(x=>x.type==='in'),x=>x.amount);
  const cashOut=rsum(t.filter(x=>x.type==='out'),x=>x.amount);
  return{from,to,rev,saleRev,otherRev,cogs,gross,opex,profit:r2(gross-opex),
    margin:rev>0?r2(gross/rev*100):0,netMargin:rev>0?r2((gross-opex)/rev*100):0,
    cashIn,cashOut,cashNet:r2(cashIn-cashOut),
    purchasePay:rsum(t.filter(x=>x.type==='out'&&x.cat==='进货采购'),x=>x.amount),
    purchaseTotal:rsum(p,x=>x.total),debtIn:rsum(t.filter(x=>x.type==='in'&&x.cat==='收欠款'),x=>x.amount),
    debtOut:rsum(t.filter(x=>x.type==='out'&&x.cat==='付欠款'),x=>x.amount),
    saleCount:s.length,txnCount:t.length,opexT,sales:s,txns:t,purs:p};
}
function dailySeries(from,to){
  const labels=[],rev=[],opex=[],cashIn=[],cashOut=[];
  const sBy=groupBy(D().sales.filter(x=>x.date>=from&&x.date<=to),x=>x.date);
  const tBy=groupBy(D().txns.filter(x=>x.date>=from&&x.date<=to),x=>x.date);
  let d=from;
  while(d<=to){
    labels.push(d);
    const ss=sBy[d]||[],tt=tBy[d]||[];
    rev.push(rsum(ss,x=>x.net)+rsum(tt.filter(x=>x.type==='in'&&x.pnl==='rev'),x=>x.amount));
    cashIn.push(rsum(tt.filter(x=>x.type==='in'),x=>x.amount));
    cashOut.push(rsum(tt.filter(x=>x.type==='out'),x=>x.amount));
    opex.push(rsum(tt.filter(x=>x.type==='out'&&x.pnl==='opex'),x=>x.amount));
    d=addDays(d,1);
  }
  return{labels,rev,opex,cashIn,cashOut};
}
function opexByCat(from,to){
  const m={};
  D().txns.filter(x=>x.date>=from&&x.date<=to&&x.type==='out'&&x.pnl==='opex').forEach(x=>{m[x.cat]=r2((m[x.cat]||0)+num(x.amount))});
  return Object.keys(m).map(k=>({name:k,value:m[k]})).sort(byDesc(v=>v.value));
}
function revByCat(from,to){
  const m={};
  D().sales.filter(x=>x.date>=from&&x.date<=to).forEach(x=>{m['商品销售']=r2((m['商品销售']||0)+num(x.net))});
  D().txns.filter(x=>x.date>=from&&x.date<=to&&x.type==='in'&&x.pnl==='rev').forEach(x=>{m[x.cat]=r2((m[x.cat]||0)+num(x.amount))});
  return Object.keys(m).map(k=>({name:k,value:m[k]})).sort(byDesc(v=>v.value));
}
function topProducts(from,to,n){
  const m={};
  D().sales.filter(x=>x.date>=from&&x.date<=to).forEach(s=>(s.items||[]).forEach(it=>{
    const k=(it.pid||'')+it.name+(it.spec||'');
    m[k]=m[k]||{name:it.name,spec:it.spec||'',qty:0,rev:0,profit:0};
    m[k].qty=r2(m[k].qty+num(it.qty));
    m[k].rev=r2(m[k].rev+num(it.qty)*num(it.price));
    m[k].profit=r2(m[k].profit+num(it.qty)*(num(it.price)-num(it.cost)));
  }));
  return Object.values(m).sort(byDesc(v=>v.profit)).slice(0,n||10);
}
function byMethod(from,to){
  const m={};
  D().txns.filter(x=>x.date>=from&&x.date<=to&&x.type==='in'&&x.cat!=='期初资金').forEach(x=>{const k=x.method||'其他';m[k]=r2((m[k]||0)+num(x.amount))});
  return Object.keys(m).map(k=>({name:k,value:m[k]})).sort(byDesc(v=>v.value));
}
function custRank(from,to,n){
  const m={};
  D().sales.filter(x=>x.date>=from&&x.date<=to&&(x.customer||'').trim()).forEach(s=>{
    const k=s.customer.trim();m[k]=m[k]||{name:k,rev:0,n:0,profit:0};
    m[k].rev=r2(m[k].rev+num(s.net));m[k].profit=r2(m[k].profit+num(s.profit));m[k].n++;
  });
  return Object.values(m).sort(byDesc(v=>v.rev)).slice(0,n||8);
}
function catRank(from,to,n){
  const m={};
  D().sales.filter(x=>x.date>=from&&x.date<=to).forEach(s=>(s.items||[]).forEach(it=>{
    const p=P().find(z=>z.id===it.pid);const k=(p&&p.cat)||'其他';
    m[k]=m[k]||{name:k,rev:0,profit:0};
    m[k].rev=r2(m[k].rev+num(it.qty)*num(it.price));
    m[k].profit=r2(m[k].profit+num(it.qty)*(num(it.price)-num(it.cost)));
  }));
  return Object.values(m).sort(byDesc(v=>v.rev)).slice(0,n||8);
}

/* ---------- 图表（纯 SVG） ---------- */
function niceStep(x){if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function shortNum(v){if(Math.abs(v)>=10000)return (v/10000).toFixed(Math.abs(v)%10000<100?0:1)+'w';if(Math.abs(v)>=1000)return (v/1000).toFixed(1)+'k';return String(Math.round(v*10)/10)}

function areaChart(labels,series,opt){
  opt=opt||{};
  const W=720,H=opt.h||224,PL=44,PR=12,PT=14,PB=26,iw=W-PL-PR,ih=H-PT-PB;
  let max=0;series.forEach(s=>s.data.forEach(v=>{if(v>max)max=v}));
  if(max<=0)max=100;
  const step=niceStep(max/3.2),top=Math.max(step,Math.ceil(max/step)*step);
  const X=i=>labels.length<2?PL+iw/2:PL+iw*i/(labels.length-1);
  const Y=v=>PT+ih-(v/top)*ih;
  let g='';
  for(let v=0;v<=top+1e-6;v+=step){const y=Y(v);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f6"/><text x="'+(PL-7)+'" y="'+(y+3.6).toFixed(1)+'" font-size="10" fill="#94a3b8" text-anchor="end">'+shortNum(v)+'</text>'}
  const every=Math.max(1,Math.ceil(labels.length/(opt.xticks||7)));
  let xl='';labels.forEach((d,i)=>{if(i%every===0||i===labels.length-1)xl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" font-size="10" fill="#94a3b8" text-anchor="middle">'+cnMD(d)+'</text>'});
  const gid='g'+Math.random().toString(36).slice(2,7);
  let defs='',body='';
  series.forEach((s,si)=>{
    const pts=s.data.map((v,i)=>X(i).toFixed(1)+' '+Y(v).toFixed(1));
    if(s.area!==false){
      defs+='<linearGradient id="'+gid+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+s.color+'" stop-opacity=".26"/><stop offset="1" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>';
      body+='<path d="M'+pts.join(' L ')+' L '+X(s.data.length-1).toFixed(1)+' '+(PT+ih)+' L '+X(0).toFixed(1)+' '+(PT+ih)+' Z" fill="url(#'+gid+si+')"/>';
    }
    body+='<path d="M'+pts.join(' L ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>';
    if(s.data.length<=45)s.data.forEach((v,i)=>{if(v>0)body+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.3" fill="#fff" stroke="'+s.color+'" stroke-width="1.7"/>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+(opt.px||224)+'px"><defs>'+defs+'</defs>'+g+xl+body+'</svg>';
}
function barChart(labels,series,opt){
  opt=opt||{};
  const W=720,H=opt.h||224,PL=44,PR=12,PT=14,PB=26,iw=W-PL-PR,ih=H-PT-PB;
  let max=0;series.forEach(s=>s.data.forEach(v=>{if(v>max)max=v}));
  if(max<=0)max=100;
  const step=niceStep(max/3.2),top=Math.max(step,Math.ceil(max/step)*step);
  const Y=v=>PT+ih-(v/top)*ih,slot=iw/Math.max(1,labels.length);
  const bw=Math.max(2,Math.min(20,slot*0.66/series.length));
  let g='';
  for(let v=0;v<=top+1e-6;v+=step){const y=Y(v);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f6"/><text x="'+(PL-7)+'" y="'+(y+3.6).toFixed(1)+'" font-size="10" fill="#94a3b8" text-anchor="end">'+shortNum(v)+'</text>'}
  const every=Math.max(1,Math.ceil(labels.length/(opt.xticks||8)));
  let xl='';labels.forEach((d,i)=>{if(i%every===0)xl+='<text x="'+(PL+slot*i+slot/2).toFixed(1)+'" y="'+(H-7)+'" font-size="10" fill="#94a3b8" text-anchor="middle">'+cnMD(d)+'</text>'});
  let body='';
  series.forEach((s,si)=>s.data.forEach((v,i)=>{
    const x=PL+slot*i+slot/2-(bw*series.length)/2+bw*si,y=Y(v),h=Math.max(0,PT+ih-y);
    if(h>0.3)body+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(3,bw/2.6).toFixed(1)+'" fill="'+s.color+'"/>';
  }));
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+(opt.px||224)+'px">'+g+xl+body+'</svg>';
}
function arcPath(cx,cy,R,r,a0,a1){
  const lg=(a1-a0)>Math.PI?1:0;
  const p=(rad,a)=>(cx+rad*Math.cos(a)).toFixed(2)+' '+(cy+rad*Math.sin(a)).toFixed(2);
  return 'M'+p(R,a0)+'A'+R+' '+R+' 0 '+lg+' 1 '+p(R,a1)+'L'+p(r,a1)+'A'+r+' '+r+' 0 '+lg+' 0 '+p(r,a0)+'Z';
}
function donut(items,opt){
  opt=opt||{};const size=opt.size||176,R=size/2,r=R*(opt.thick||0.62);
  const total=sum(items,i=>i.value);
  if(total<=0)return '<svg class="chart" viewBox="0 0 '+size+' '+size+'" style="height:'+size+'px"><circle cx="'+R+'" cy="'+R+'" r="'+((R+r)/2)+'" fill="none" stroke="#eef1f6" stroke-width="'+(R-r)+'"/></svg>';
  let a0=-Math.PI/2,body='';
  items.forEach((it,i)=>{
    const frac=it.value/total;let a1=a0+frac*Math.PI*2;
    if(frac>0.99999)a1=a0+Math.PI*2-0.0001;
    body+='<path d="'+arcPath(R,R,R-1.5,r,a0,a1)+'" fill="'+(it.color||PAL[i%PAL.length])+'"><title>'+esc(it.name)+' ¥'+fmt(it.value)+'</title></path>';
    a0=a1;
  });
  const ct=opt.center||['',''];
  body+='<text x="'+R+'" y="'+(R-3)+'" text-anchor="middle" font-size="11" fill="#94a3b8">'+esc(ct[0])+'</text>';
  body+='<text x="'+R+'" y="'+(R+17)+'" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">'+esc(ct[1])+'</text>';
  return '<svg class="chart" viewBox="0 0 '+size+' '+size+'" style="height:'+size+'px;max-width:'+size+'px;margin:0 auto">'+body+'</svg>';
}
function hbars(items,opt){
  opt=opt||{};
  const max=Math.max.apply(null,items.map(i=>i.value).concat([1]));
  const w=opt.w||112;
  return items.map((it,i)=>'<div class="srow"><div class="ell small bold" style="width:'+w+'px;flex:0 0 '+w+'px" title="'+esc(it.name)+'">'+esc(it.name)+'</div>'+
    '<div class="track"><div class="bar" style="width:'+(it.value/max*100).toFixed(1)+'%;background:'+(it.color||PAL[i%PAL.length])+'"></div></div>'+
    '<div class="num nowrap small bold" style="width:'+(opt.vw||92)+'px;text-align:right;flex:0 0 '+(opt.vw||92)+'px">'+(opt.fmt?opt.fmt(it,it.value):money(it.value))+'</div></div>').join('');
}

function cartTotals(){
  const sub=rsum(cart.items,i=>num(i.qty)*num(i.price));
  const cost=rsum(cart.items,i=>num(i.qty)*num(i.cost));
  const disc=clamp(r2(cart.discount),0,sub);
  const net=r2(sub-disc);
  return{sub,cost:r2(cost),disc,net,profit:r2(net-cost)};
}
function itemRow(it,i){
  return '<div class="it" data-i="'+i+'"><div class="info"><div class="nm ell">'+esc(it.name)+'</div>'+
    '<div class="sp ell">'+esc([it.spec,fmt0(it.stock)+' '+(it.unit||'个')+' 库存','进价 '+fmt(it.cost)].filter(Boolean).join(' · '))+'</div></div>'+
    '<div class="qty"><button data-q="-1">−</button><input class="num" data-qty inputmode="decimal" value="'+fmt0(it.qty)+'"><button data-q="1">+</button></div>'+
    '<input class="inp num" data-price inputmode="decimal" value="'+fmt(it.price)+'" style="width:80px;padding:6px 8px;text-align:right;flex:0 0 80px" title="售价">'+
    '<div class="amt num">'+money(r2(num(it.qty)*num(it.price)))+'</div>'+
    '<button class="iconbtn danger" data-del>'+ico('trash')+'</button></div>';
}

    readCart(root);render();

  };

  const dc=$('#cDisc',root);
  dc.onchange=()=>sync('cDisc');
  dc.oninput=()=>{clearTimeout(root._t);root._t=setTimeout(()=>{readCart(root);const T=cartTotals();
    const box=root.querySelector('.total-box');if(box){box.children[1].querySelector('span:last-child').textContent='-'+money(T.disc);
      box.children[2].querySelector('span:last-child').textContent=money(T.net);
      box.children[3].querySelector('span:last-child').textContent=money(T.profit)+'（'+(T.net>0?r2(T.profit/T.net*100):0)+'%）'}},380)};
  $$('[data-paid]',root).forEach(b=>b.onclick=()=>{readCart(root);const T=cartTotals();
    cart.paid=b.dataset.paid==='full'?String(T.net):b.dataset.paid==='half'?String(r2(T.net/2)):'0';
    if(b.dataset.paid==='zero')cart.method='赊账';else if(cart.method==='赊账')cart.method='微信';
    render()});
  $('#cSave',root).onclick=()=>{readCart(root);saveSale()};
  const cc=$('#cClearIt',root);if(cc)cc.onclick=()=>{cart.items=[];render()};
  $$('.it',root).forEach(row=>{
    const i=+row.dataset.i;
    row.querySelector('[data-q="-1"]').onclick=()=>{cart.items[i].qty=r2(Math.max(0.01,num(cart.items[i].qty)-1));sync()};
    row.querySelector('[data-q="1"]').onclick=()=>{cart.items[i].qty=r2(num(cart.items[i].qty)+1);sync()};
    const qi=row.querySelector('[data-qty]');qi.onchange=()=>{const v=r2(qi.value);cart.items[i].qty=v>0?v:0.01;sync()};
    const pi=row.querySelector('[data-price]');pi.onchange=()=>{cart.items[i].price=Math.max(0,r2(pi.value));sync('cSearch')};
    row.querySelector('[data-del]').onclick=()=>{cart.items.splice(i,1);sync()};
  });
  bindChips(root,(v,n)=>{if(n==='pcat'){saleCat=v;hotList(root)}});

  const si=$('#cSearch',root),res=$('#cRes',root);
  const doSearch=()=>{
    const q=si.value.trim().toLowerCase();
    if(!q){res.classList.remove('on');return}
    const list=P().filter(p=>((p.name||'')+' '+(p.spec||'')+' '+(p.cat||'')+' '+(p.py||'')).toLowerCase().indexOf(q)>=0).slice(0,24);
    if(!list.length){
      res.innerHTML='<div class="pk" style="cursor:default"><div><div class="n muted">未找到「'+esc(si.value)+'」</div><div class="m">可以立即新建这个商品</div></div></div>'+
        '<div class="pk" data-new="'+esc(si.value)+'" style="color:var(--brand2);font-weight:700">'+ico('plus')+' 新建商品「'+esc(si.value)+'」</div>';
    }else{
      res.innerHTML=list.map(p=>'<div class="pk" data-pid="'+p.id+'"><div style="flex:1;min-width:0"><div class="n ell">'+esc(p.name)+(p.spec?' <span class="muted tiny">'+esc(p.spec)+'</span>':'')+'</div>'+
        '<div class="m">'+esc(p.cat||'未分类')+' · 库存 '+fmt0(p.stock)+(num(p.stock)<=num(p.minStock||0)?' <span class="neg">不足</span>':'')+'</div></div>'+
        '<div class="p"><div class="num bold">'+money(p.price)+'</div><div class="m tiny">/'+esc(p.unit||'个')+'</div></div></div>').join('');
    }
    res.classList.add('on');
    $$('[data-pid]',res).forEach(el=>el.onmousedown=e=>{e.preventDefault();addProd(el.dataset.pid);si.value='';res.classList.remove('on');si.focus()});
    const nw=res.querySelector('[data-new]');
    if(nw)nw.onmousedown=e=>{e.preventDefault();res.classList.remove('on');si.value='';prodForm({name:nw.dataset.new},()=>render())};
  };
  si.oninput=doSearch;si.onfocus=doSearch;
  si.onkeydown=e=>{
    if(e.key==='Enter'){
      const f=res.querySelector('[data-pid]');
      if(f){addProd(f.dataset.pid);si.value='';res.classList.remove('on')}
      else if(si.value.trim()){const q=si.value.trim();si.value='';res.classList.remove('on');prodForm({name:q},()=>render())}
    }
    if(e.key==='Escape')res.classList.remove('on');
  };

}
function readCart(root){

function hotList(root){
  const box=$('#cHot',root);if(!box)return;
  let list=P().slice();
  if(saleCat!=='全部')list=list.filter(p=>(p.cat||'未分类')===saleCat);
  const sold={};D().sales.slice(0,150).forEach(s=>(s.items||[]).forEach(it=>{sold[it.pid]=(sold[it.pid]||0)+num(it.qty)}));
  list.sort((a,b)=>(sold[b.id]||0)-(sold[a.id]||0)||String(a.name).localeCompare(String(b.name),'zh'));
  box.innerHTML='<div class="tiny muted mb8">'+(saleCat==='全部'?'常卖商品（按近期销量排序）':esc(saleCat))+' · '+list.length+' 项</div>'+
    (list.length?'<div class="grid g3" style="gap:8px">'+list.slice(0,60).map(p=>{
      const lw=num(p.stock)<=num(p.minStock||0);
      return '<button class="btn" data-add="'+p.id+'" style="padding:9px 10px;justify-content:flex-start;gap:7px;text-align:left;'+(lw?'border-color:#f3d3a6;background:#fffcf6':'')+'">'+
        '<span style="flex:1;min-width:0"><span class="ell" style="display:block;font-size:12.8px">'+esc(p.name)+'</span>'+
        '<span class="tiny ell '+(lw?'neg':'muted')+'" style="display:block">'+money(p.price)+' · 存 '+fmt0(p.stock)+'</span></span></button>'}).join('')+'</div>'
      :emptyBox('🔍','该分类下没有商品'));

function addProd(pid,qty){
  const p=P().find(x=>x.id===pid);if(!p)return;
  const ex=cart.items.find(x=>x.pid===pid);
  if(ex)ex.qty=r2(num(ex.qty)+(qty||1));
  else cart.items.push({pid:p.id,name:p.name,spec:p.spec||'',unit:p.unit||'个',qty:qty||1,cost:num(p.cost),price:num(p.price),stock:num(p.stock)});
  render();
}
function saveSale(){
  if(!cart.items.length){toast('请先添加商品','err');return}
  const T=cartTotals();
  if(T.net<=0){toast('应收金额需大于 0','err');return}
  const cust=String(cart.customer||'').trim();
  const isCredit=cart.method==='赊账';
  if(isCredit&&!cust){toast('赊账必须填写客户名称，否则日后无法催收','err');const e=$('#cCust');e&&e.classList.add('err');return}
  const paid=isCredit?0:clamp(r2(cart.paid===''?T.net:cart.paid),0,T.net);
  const d=String(cart.date||today()).slice(0,10);
  const pre='XS'+d.replace(/-/g,'');
  const no=pre+'-'+pad(D().sales.filter(s=>String(s.no||'').indexOf(pre)===0).length+1);
  const sale={id:uid(),no,date:d,customer:cust,
    items:cart.items.map(i=>({pid:i.pid,name:i.name,spec:i.spec,unit:i.unit,qty:num(i.qty),cost:num(i.cost),price:num(i.price)})),
    sub:T.sub,discount:T.disc,net:T.net,cost:T.cost,profit:T.profit,paid,method:cart.method,
    note:String(cart.note||'').trim(),ts:Date.now()};
  D().sales.unshift(sale);
  sale.items.forEach(it=>{const p=P().find(x=>x.id===it.pid);if(p)p.stock=r2(num(p.stock)-num(it.qty))});
  if(paid>0)D().txns.unshift({id:uid(),date:d,type:'in',cat:'商品销售',amount:paid,method:sale.method,party:cust,note:'销售单 '+sale.no,pnl:null,src:'sale',srcId:sale.id,ts:Date.now()});
  DB.save();
  newCart(true);
  toast('已保存 '+sale.no+' · '+money(sale.net)+(saleOwed(sale)>0.009?'（挂账 '+money(saleOwed(sale))+'）':''));
  const lowWarn=sale.items.filter(it=>{const p=P().find(x=>x.id===it.pid);return p&&num(p.stock)<=num(p.minStock||0)});
  modal({title:'销售单已保存',
    body:'<div class="center" style="padding:4px 0"><div style="font-size:42px">✅</div>'+
      '<div class="num bold" style="font-size:28px;margin-top:4px;letter-spacing:-1px">'+money(sale.net)+'</div>'+
      '<div class="small muted mt8">'+esc(sale.no)+' · '+esc(sale.customer||'散客')+' · '+sale.items.length+' 项商品 · 毛利 '+money(sale.profit)+'</div>'+
      (saleOwed(sale)>0.009?'<div class="alert warn mt12" style="text-align:left">'+ico('users')+'<div>本单挂账 <b>'+money(saleOwed(sale))+'</b>，已计入「应收欠款」，收款时在应收应付页登记。</div></div>':'')+
      (lowWarn.length?'<div class="alert danger mt12" style="text-align:left">'+ico('alert')+'<div>库存预警：'+lowWarn.map(it=>{const p=P().find(x=>x.id===it.pid);return esc(it.name)+' 剩 '+fmt0(p?p.stock:0)}).join('、')+'</div></div>':'')+
      '</div>',
    footer:'<button class="btn" id="pNext2">关闭</button><button class="btn" id="pPrint">'+ico('print')+'打印小票</button><button class="btn pri" id="pNext">'+ico('plus')+'继续开单</button>',
    mount(sh){

      $('#pNext',sh).onclick=()=>{closeModal();render();const s=$('#cSearch');if(s)s.focus()};

function pTotals(){
  const total=rsum(pcart.items,i=>num(i.qty)*num(i.cost));
  const paid=pcart.method==='赊账'?0:clamp(r2(pcart.paid===''?total:pcart.paid),0,total);
  return{total,paid,owed:r2(total-paid)};
}

function readPCart(root){
  const g=id=>{const e=$('#'+id,root);return e?e.value:null};
  const s=g('pSup');if(s!==null)pcart.supplier=s;
  const d=g('pDate');if(d)pcart.date=d;

function addPProd(pid,qty){

function savePurchase(root){
  if(!pcart.items.length){toast('请先添加进货商品','err');return}
  const T=pTotals();
  if(T.total<=0){toast('进货总额需大于 0','err');return}
  readPCart(root);
  const d=String(pcart.date||today()).slice(0,10);
  const sup=String(pcart.supplier||'').trim();
  if(T.owed>0.009&&!sup){toast('有货款未付，请填写供应商名称','err');const e=$('#pSup',root);e&&e.classList.add('err');return}
  const pre='JH'+d.replace(/-/g,'');
  const no=pre+'-'+pad(D().purchases.filter(s=>String(s.no||'').indexOf(pre)===0).length+1);
  const rec={id:uid(),no,date:d,supplier:sup,
    items:pcart.items.map(i=>{const p=P().find(x=>x.id===i.pid)||{};return{pid:i.pid,name:i.name,spec:i.spec,qty:num(i.qty),cost:num(i.cost),oldCost:num(p.cost),oldStock:num(p.stock)}}),
    total:T.total,paid:T.paid,method:pcart.method,note:String(pcart.note||'').trim(),ts:Date.now()};
  D().purchases.unshift(rec);
  rec.items.forEach(it=>{
    const p=P().find(x=>x.id===it.pid);if(!p)return;
    const os=num(p.stock),oc=num(p.cost);
    p.stock=r2(os+it.qty);
    p.cost=p.stock>0?r2((os*oc+it.qty*it.cost)/p.stock):it.cost;
  });
  if(T.paid>0)D().txns.unshift({id:uid(),date:d,type:'out',cat:'进货采购',amount:T.paid,method:rec.method,party:sup,note:'进货单 '+rec.no,pnl:null,src:'pur',srcId:rec.id,ts:Date.now()});
  DB.save();newPCart(true);
  toast('已入库 '+rec.no+' · '+money(rec.total)+(T.owed>0.009?'（欠 '+money(T.owed)+'）':''));
  render();
}

const PY_BOUND='啊八擦搭蛾发噶哈击喀拉妈拿噢啪七然撒他挖夕丫匝';
const PY_LETTER='abcdefghjklmnopqrstwxyz';
function pinyin(s){
  try{
    let out='';
    for(const ch of String(s)){
      if(/[a-zA-Z0-9]/.test(ch)){out+=ch.toLowerCase();continue}
      if(!/[\u4e00-\u9fa5]/.test(ch))continue;
      let i=0;
      while(i<PY_BOUND.length-1&&PY_BOUND[i+1].localeCompare(ch,'zh-CN-u-co-pinyin')<=0)i++;
      out+=PY_LETTER[i]||'';
    }
    return out;
  }catch(e){return ''}
}

        '<td class="r num nowrap"><span class="pos">'+fmt(s.paid)+'</span>'+(saleOwed(s)>0.009?'<div class="neg tiny">欠 '+fmt(saleOwed(s))+'</div>':'')+'</td>'+

  }
  if(billTab==='pur'){
    const l=D().purchases.filter(p=>inRange(p.date)&&matchQ([p.no,p.supplier,p.note,p.method].concat((p.items||[]).map(i=>i.name+' '+i.qty+' '+i.cost)).join(' ')));

      l.slice(0,400).map(p=>'<tr><td class="nowrap"><b class="tiny">'+esc(p.no)+'</b><div class="tiny muted">'+esc(p.date)+'</div></td>'+

        '<td style="max-width:260px"><div class="ell small">'+esc((p.items||[]).map(i=>i.name+'×'+fmt0(i.qty)).join('、'))+'</div></td>'+
        '<td class="r num bold nowrap">'+fmt(p.total)+'</td>'+
        '<td class="r num nowrap"><span class="neg">'+fmt(p.paid)+'</span>'+(purOwed(p)>0.009?'<div class="neg tiny">欠 '+fmt(purOwed(p))+'</div>':'')+'</td>'+
        '<td class="c nowrap"><button class="iconbtn" data-pur="'+p.id+'" title="查看">'+ico('search')+'</button>'+
        (purOwed(p)>0.009?'<button class="iconbtn" data-settlep="'+p.id+'" title="登记付款">'+ico('wallet')+'</button>':'')+
        '<button class="iconbtn danger" data-dpur="'+p.id+'" title="删除">'+ico('trash')+'</button></td></tr>').join('')+
      '</tbody></table></div>';

  let l=D().txns.filter(t=>inRange(t.date));
  if(billFilter.type==='收入')l=l.filter(t=>t.type==='in');
  if(billFilter.type==='支出')l=l.filter(t=>t.type==='out');
  if(billFilter.q.trim())l=l.filter(t=>matchQ([t.cat,t.party,t.note,t.method,t.amount,t.date].join(' ')));
  if(!l.length)return emptyBox('📒','没有符合条件的流水记录','调整筛选条件，或去「快速记账」添加');
  const inc=rsum(l.filter(t=>t.type==='in'),t=>t.amount),out=rsum(l.filter(t=>t.type==='out'),t=>t.amount);
  const g=groupBy(l,t=>t.date),days=Object.keys(g).sort().reverse();
  let html='<div class="row wrap" style="padding:11px 18px;border-bottom:1px solid var(--line2);background:var(--panel2);gap:14px">'+

    html+='<div class="list">'+its.map(txnRow).join('')+'</div>';

        confirmDlg({title:'删除这笔流水？',danger:1,ok:'删除',msg:t.cat+' '+money(t.amount)+' · '+t.date,
          onOk:()=>{D().txns=D().txns.filter(x=>x.id!==id);DB.save();toast('已删除');render()}})};
      const e=$('#t_edit',sh);if(e)e.onclick=()=>{closeModal();editTxn(t)};
    }});
}
function editTxn(t){
  let type=t.type,cat=t.cat;
  const catsFor=ty=>ty==='in'?CAT_IN.filter(c=>c!=='收欠款'):OPEX_CATS;
  if(catsFor(type).indexOf(cat)<0)cat=catsFor(type)[0];
  modal({title:'编辑流水',
    body:'<div class="seg full mb16" id="eType"><button data-t="out" class="'+(type==='out'?'on':'')+'">支出</button><button data-t="in" class="'+(type==='in'?'on':'')+'">收入</button></div>'+
      '<div class="grid g2">'+field('金额','<input class="inp num" id="e_amt" inputmode="decimal" value="'+fmt(t.amount)+'">',1)+
      field('日期','<input class="inp" id="e_date" type="date" value="'+esc(t.date)+'">')+'</div>'+
      field('分类','<div id="eCatBox">'+catChips(catsFor(type),cat,'ecat')+'</div>')+
      '<div class="grid g2">'+field('方式','<select class="inp" id="e_method">'+METHODS.filter(m=>m!=='赊账').map(m=>'<option'+(m===t.method?' selected':'')+'>'+m+'</option>').join('')+'</select>')+
      field('对象','<input class="inp" id="e_party" value="'+esc(t.party||'')+'">')+'</div>'+
      field('备注','<input class="inp" id="e_note" value="'+esc(t.note||'')+'">'),
    footer:'<button class="btn" data-mclose>取消</button><button class="btn pri" id="e_ok">'+ico('check')+'保存</button>',
    mount(sh){
      const bindCat=()=>bindChips($('#eCatBox',sh),v=>{cat=v});
      bindCat();
      $('#eType',sh).onclick=e=>{
        const b=e.target.closest('button');if(!b)return;
        type=b.dataset.t;
        $$('#eType button',sh).forEach(x=>x.classList.toggle('on',x.dataset.t===type));
        const cs=catsFor(type);cat=cs.indexOf(cat)>=0?cat:cs[0];
        $('#eCatBox',sh).innerHTML=catChips(cs,cat,'ecat');
        bindCat();
      };
      $('#e_ok',sh).onclick=()=>{
        const amt=r2($('#e_amt',sh).value);
        if(amt<=0){toast('金额需大于 0','err');return}
        t.type=type;t.cat=cat;t.amount=amt;t.date=$('#e_date',sh).value||t.date;
        t.method=$('#e_method',sh).value;t.party=$('#e_party',sh).value.trim();t.note=$('#e_note',sh).value.trim();
        t.pnl=type==='in'?'rev':'opex';
        DB.save();closeModal();toast('已保存修改');render();
      };
    }});
}

function applySettle(type,item,amt,method,date,note){
  const isAR=type==='ar';
  const cat=isAR?'收欠款':'付欠款';
  const base=(item.desc||'')+(note?' · '+note:'');
  if(item.kind==='multi'){
    let left=amt;
    item.items.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(x=>{
      if(left<=0.009)return;
      const a=r2(Math.min(left,x.owed));left=r2(left-a);
      applyOne(x,a,method,date,cat,base);
    });
  }else applyOne(item,amt,method,date,cat,base);
  DB.save();
}
function applyOne(item,amt,method,date,cat,note){
  const isAR=cat==='收欠款';
  if(item.kind==='sale'){
    const s=D().sales.find(x=>x.id===item.id);if(!s)return;
    s.paid=r2(num(s.paid)+amt);
    D().txns.unshift({id:uid(),date,type:'in',cat,amount:amt,method,party:s.customer||'散客',note:'收 '+s.no+(note?' · '+note:''),pnl:null,src:'debt',srcId:s.id,ts:Date.now()});
  }else if(item.kind==='pur'){
    const p=D().purchases.find(x=>x.id===item.id);if(!p)return;
    p.paid=r2(num(p.paid)+amt);
    D().txns.unshift({id:uid(),date,type:'out',cat,amount:amt,method,party:p.supplier||'',note:'付 '+p.no+(note?' · '+note:''),pnl:null,src:'debt',srcId:p.id,ts:Date.now()});
  }else{
    const d=D().debts.find(x=>x.id===item.id);if(!d)return;
    d.records=d.records||[];
    d.records.push({id:uid(),date,delta:r2(-amt),note:(isAR?'收款 ':'付款 ')+money(amt)+(note?' · '+note:'')});
    D().txns.unshift({id:uid(),date,type:isAR?'in':'out',cat,amount:amt,method,party:d.name,note:(d.note||'历史欠款')+(note?' · '+note:''),pnl:null,src:'debt',srcId:d.id,ts:Date.now()});
  }
}

    mount(sh){

let repRange={key:'month',from:'',to:''};
function calcRange(){
  const t=today();
  switch(repRange.key){
    case 'today':return{from:t,to:t,label:'今天'};
    case 'yest':{const y=addDays(t,-1);return{from:y,to:y,label:'昨天'}}
    case 'week':{const w=(new Date().getDay()+6)%7;return{from:addDays(t,-w),to:t,label:'本周'}}
    case 'month':return{from:monthStart(t),to:t,label:t.slice(0,7)+' 本月'};
    case 'last':{const lm=addMonths(monthStart(t),-1);return{from:lm,to:lastDay(lm),label:lm.slice(0,7)+' 上月'}}
    case '30':return{from:addDays(t,-29),to:t,label:'近 30 天'};
    case 'year':return{from:t.slice(0,5)+'-01-01',to:t,label:t.slice(0,5)+' 本年'};
    default:return{from:repRange.from||monthStart(t),to:repRange.to||t,label:'自定义'};
  }
}

  const ra=$('#rApply',root);
  if(ra)ra.onclick=()=>{repRange.from=$('#rFrom',root).value;repRange.to=$('#rTo',root).value;
    if(repRange.from>repRange.to){const a=repRange.from;repRange.from=repRange.to;repRange.to=a}
    render()};
};
function plRow(k,v,strong,cls){
  return '<div class="row" style="padding:'+(strong?'9px':'5.5px')+' 0;'+(strong?'border-bottom:1px solid var(--line2)':'')+'">'+
    '<span class="'+(strong?'bold':'small')+' '+(cls||'')+'" style="'+(cls==='muted'?'color:var(--ink3)':'')+'">'+k+'</span><span class="spacer"></span>'+
    '<b class="num '+(cls||'')+'" style="font-size:'+(strong?'15.5px':'13px')+'">'+v+'</b></div>';
}
function calcPrev(from,to){
  if(repRange.key==='month'||repRange.key==='last'){
    const ms=addMonths(monthStart(from),-1);
    return{from:ms,to:lastDay(ms)};
  }
  if(repRange.key==='year'){
    const y=String(parseInt(from.slice(0,4),10)-1);
    return{from:y+'-01-01',to:y+'-12-31'};
  }
  const n=daysBetween(from,to)+1;
  return{from:addDays(from,-n),to:addDays(from,-1)};
}
function cmpPct(cur,prev,goodUp){
  if(!prev)return cur===0?'<span class="muted">持平</span>':'<span class="pos">新增</span>';
  const d=Math.abs(r2((cur-prev)/Math.abs(prev)*100));
  const up=cur>=prev;
  const cls=(up===goodUp)?'pos':'neg';
  return '<span class="'+cls+'">'+(up?'↑':'↓')+' '+d.toFixed(1)+'%</span>';
}
function monthList(n){
  const t=today(),out=[];
  for(let i=0;i<n;i++){
    const ms=addMonths(monthStart(t),-i);
    const me=i===0?t:lastDay(ms);
    out.push({label:ms.slice(0,7),from:ms,to:me,pl:PL(ms,me)});
  }
  return out;
}

function seedDemo(){
  const d=DB.blank();
  d.meta={shop:'鑫源五金',owner:'张老板',phone:'138-0000-8888',addr:'城东建材市场 A 区 12 号',ticket:'谢谢惠顾，欢迎再次光临！'};
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const ri=(a,b)=>Math.floor(rnd(a,b+1));
  const pick=a=>a[ri(0,a.length-1)];
  const prods=DEMO_GOODS.map(g=>({id:uid(),name:g[0],cat:g[1],spec:g[2],unit:g[3],cost:g[4],price:g[5],
    stock:0,minStock:Math.max(2,ri(3,12)),supplier:g[6],note:'',py:pinyin(g[0]),createdAt:Date.now()}));
  d.products=prods;

  const t=today(),DAYS=75;
  const custs=['李师傅','王工地','陈装修','刘水电','赵老板','孙木工','周物业','吴包工头','郑家装','冯维修','钱工程','许师傅'];
  const methods=['微信','现金','支付宝','银行卡','对公转账'];
  const soldMap={};
  const sales=[];
  for(let i=DAYS;i>=0;i--){
    const date=addDays(t,-i);
    const dow=new Date(date+'T00:00:00').getDay();
    let n=ri(2,6);
    if(dow===0)n=Math.max(1,n-2);
    if(dow===6)n=n+1;
    for(let k=0;k<n;k++){
      const nItems=ri(1,4);
      const items=[];
      for(let j=0;j<nItems;j++){
        const p=pick(prods);
        if(items.find(x=>x.pid===p.id))continue;
        const qty=p.cost>80?ri(1,2):p.cost>20?ri(1,4):ri(1,10);
        let price=num(p.price);
        if(Math.random()<0.25)price=r2(price*(1-rnd(0.02,0.12)));
        items.push({pid:p.id,name:p.name,spec:p.spec,unit:p.unit,qty,cost:num(p.cost),price});
        soldMap[p.id]=(soldMap[p.id]||0)+qty;
      }
      if(!items.length)continue;
      const sub=rsum(items,x=>x.qty*x.price);
      const cost=rsum(items,x=>x.qty*x.cost);
      const disc=Math.random()<0.3?r2(rnd(0,Math.max(1,sub*0.03))):0;
      const net=r2(sub-disc);
      const credit=Math.random()<0.22;
      const customer=credit?pick(custs):(Math.random()<0.55?pick(custs):'');
      const method=credit?'赊账':pick(methods);
      let paid=credit?0:(Math.random()<0.12?r2(net*rnd(0.3,0.7)):net);
      const pre='XS'+date.replace(/-/g,'');

const Speech={
  ok:!!(window.SpeechRecognition||window.webkitSpeechRecognition),
  rec:null,
  start(o){
    if(!this.ok)return false;
    this.stop();
    const C=window.SpeechRecognition||window.webkitSpeechRecognition;
    let r;try{r=new C()}catch(e){return false}
    this.rec=r;
    r.lang='zh-CN';r.continuous=o.continuous!==false;r.interimResults=true;r.maxAlternatives=1;
    r.onresult=e=>{
      let inter='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal)o.final&&o.final(String(res[0].transcript).trim());
        else inter+=res[0].transcript;
      }
      o.interim&&o.interim(inter);
    };
    r.onerror=e=>{o.error&&o.error(e.error)};
    r.onend=()=>{if(this.rec===r){this.rec=null;o.end&&o.end()}};
    try{r.start()}catch(e){this.rec=null;return false}
    return true;
  },
  stop(){
    if(this.rec){const r=this.rec;this.rec=null;try{r.onend=null;r.abort()}catch(e){}}
  },
  live(){return !!this.rec}
};
function cnNum(s){
  s=String(s==null?'':s).trim();
  if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s);
  const d={'零':0,'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  if(s==='十')return 10;
  if(/^十[一二三四五六七八九]$/.test(s))return 10+d[s.charAt(1)];
  if(/^[一二三四五六七八九]十$/.test(s))return d[s.charAt(0)]*10;
  if(/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(s))return d[s.charAt(0)]*10+d[s.charAt(2)];
  if(d[s]!==undefined)return d[s];
  return 1;
}
function matchProduct(q){
  q=String(q==null?'':q).trim();
  if(!q)return null;
  let best=null,score=0;
  P().forEach(p=>{
    const name=String(p.name||'');let s=0;
    if(name===q)s=100;
    else if(name.indexOf(q)>=0)s=60+q.length;
    else if(q.indexOf(name)>=0)s=50+name.length;
    else{
      const py=pinyin(q);
      if(py&&py.length>=2){
        const ppy=String(p.py||'');
        if(ppy.indexOf(py)>=0)s=40+py.length;
        else if(py.indexOf(ppy)>=0&&ppy.length>=3)s=38+ppy.length;
      }
      if(!s&&p.spec&&String(p.spec).indexOf(q)>=0)s=30+q.length;
    }
    if(s>score){score=s;best=p}
  });
  return score>=32?best:null;
}
const UNIT_RE='[个把盒根米卷包套件台瓶张只条支桶袋公斤斤]*';
function parseVoice(text,mode,lines,meta){
  String(text==null?'':text).split(/[，,。！!？?；;、\n]+/).forEach(seg=>{
    seg=seg.trim();if(!seg)return;
    let m;
    if((m=seg.match(/^(客户|买家|客人|卖给)[:：]?\s*(.+)$/))){meta.customer=m[2].trim();return}
    if((m=seg.match(/^(供应商|厂家|供货商)[:：]?\s*(.+)$/))){meta.supplier=m[2].trim();return}
    if(/赊账|挂账|先欠着/.test(seg)){meta.method='赊账';return}
    if((m=seg.match(/(优惠|抹零|便宜|让利)\s*([0-9一二两三四五六七八九十]+(?:\.[0-9]+)?)\s*(块|元|块钱)?$/))){meta.discount=r2(cnNum(m[2]));return}
    if((m=seg.match(/^(用)?(微信|现金|支付宝|银行卡|对公转账)(支付|付款|收)?$/))){meta.method=m[2];return}
    let q=seg,qty=1;
    q=q.replace(/^(来|要|拿|买|进|给我|再来)\s*/,'');
    m=q.match(new RegExp('^([0-9一二两三四五六七八九十百]+)\\s*'+UNIT_RE+'\\s*(.+)$'));
    if(m){qty=Math.max(1,Math.round(cnNum(m[1])));q=m[2]}
    q=q.trim();
    if(!q)return;
    let p=matchProduct(q);
    if(!p){const q2=q.replace(/[个把盒根米卷包套件台瓶张只条支桶袋公斤斤]+$/,'').trim();if(q2&&q2!==q)p=matchProduct(q2);if(p)q=q2}
    if(!p){const q2=q.replace(/^[个把盒根米卷包套件台瓶张只条支桶袋公斤斤]+/,'').trim();if(q2&&q2!==q)p=matchProduct(q2);if(p)q=q2}
    lines.push({q:q,qty:qty,pid:p?p.id:null,name:p?p.name:q});
  });
}

      };
    }});

/* ---------- 语音自检与错误指引 ---------- */
function voiceErrMsg(er){
  if(er==='not-allowed'||er==='service-not-allowed')return '麦克风权限被拦截：点浏览器地址栏左侧的锁/信息图标 → 网站设置 → 麦克风 → 允许；Mac 还要到「系统设置 → 隐私与安全性 → 麦克风」勾选当前浏览器';
  if(er==='audio-capture')return '没有检测到麦克风：检查麦克风/耳机是否连接，或在「系统设置 → 声音 → 输入」切换输入设备';
  if(er==='network')return '语音识别需要联网，请检查网络后重试';
  if(er==='no-speech')return '没有听到声音：请靠近麦克风说话并调大系统输入音量；仍不行请做「语音自检」';
  return '语音识别出错：'+er;

let vcStream=null,vcTimer=null;

function vcGumMsg(e){

  if(n==='NotAllowedError')return '权限被拦截：点地址栏左侧锁/信息图标 → 网站设置 → 麦克风 → 允许；Mac 还需在「系统设置 → 隐私与安全性 → 麦克风」勾选当前浏览器';
  if(n==='NotFoundError'||n==='OverconstrainedError')return '没有检测到麦克风设备：检查麦克风/耳机连接，或在「系统设置 → 声音 → 输入」选择输入设备';
  if(n==='NotReadableError')return '麦克风被其他程序占用：关闭正在使用麦克风的软件（会议/录音等）后重试';
  return '无法访问麦克风：'+(n||e||'未知错误');

function voiceDiag(){
  return new Promise(res=>{
    const rep={supported:Speech.ok,perm:'unknown',devices:[],gum:null};
    const done=()=>res(rep);
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){rep.gum='unsupported';done();return}
    const pq=navigator.permissions&&navigator.permissions.query?navigator.permissions.query({name:'microphone'}).catch(()=>null):Promise.resolve(null);
    pq.then(st=>{
      rep.perm=st?st.state:'unknown';
      navigator.mediaDevices.getUserMedia({audio:true}).then(st2=>{
        rep.gum='ok';
        const ds=navigator.mediaDevices.enumerateDevices();
        st2.getTracks().forEach(t=>t.stop());
        return ds;
      }).then(dsv=>{
        if(dsv)rep.devices=dsv.filter(d=>d.kind==='audioinput').map(d=>d.label||'麦克风设备');
        done();
      }).catch(e=>{
        rep.gum='denied:'+(e&&e.name||'err');
        navigator.mediaDevices.enumerateDevices().then(ds=>{rep.devices=ds.filter(d=>d.kind==='audioinput').map(d=>d.label||'麦克风设备')}).catch(()=>{}).then(done);
      });
    });
  });
}

    ['识别组件',rep.supported?'<span class="pos">浏览器支持</span>':'<span class="neg">浏览器不支持，请改用 Chrome / Edge</span>'],
    ['站点权限',rep.perm==='granted'?'<span class="pos">已允许</span>':rep.perm==='denied'?'<span class="neg">被拦截 → 点地址栏左侧锁/信息图标 → 网站设置 → 麦克风 → 允许</span>':'尚未请求（点自检时会弹授权框，选「允许」）'],
    ['麦克风设备',rep.devices.length?esc(rep.devices.join('、')):'<span class="neg">未检测到 → 检查麦克风/耳机连接或蓝牙</span>'],
    ['系统取音',rep.gum==='ok'?'<span class="pos">正常，可以取到声音</span>':rep.gum==='unsupported'?'<span class="neg">浏览器不支持麦克风检测</span>':'<span class="neg">'+esc(vcGumMsg({name:String(rep.gum).replace('denied:','')}))+'</span>']
  ];
  return rows.map(r=>'<div class="row small wrap" style="padding:6px 0;border-bottom:1px solid var(--line2);gap:6px"><span class="muted" style="flex:0 0 76px">'+r[0]+'</span><span style="flex:1;min-width:180px">'+r[1]+'</span></div>').join('');
}
function vcStartMeter(bar,lv){
  vcStop();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){lv.textContent='当前浏览器不支持麦克风检测';return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    vcStream=st;
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx){lv.textContent='浏览器不支持音量检测，但权限正常';return}
    const ctx=new Ctx(),src=ctx.createMediaStreamSource(st),an=ctx.createAnalyser();
    an.fftSize=512;src.connect(an);
    const buf=new Uint8Array(an.fftSize);
    vcTimer=setInterval(()=>{
      if(!document.body.contains(bar)){vcStop();try{ctx.close()}catch(e){}return}
      an.getByteTimeDomainData(buf);
      let m=0;for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]-128);if(v>m)m=v}
      const pct=Math.min(100,Math.round(m/128*100*2.4));
      bar.style.width=pct+'%';
      bar.style.background=pct>8?'var(--in)':'var(--ink3)';
      lv.textContent=pct>8?'拾音正常（音量 '+pct+'%）':'还没拾到声音… 请对着麦克风说话，或检查输入设备/输入音量';
    },60);
  }).catch(e=>{lv.textContent=vcGumMsg(e)});
}
function vcRun(container,withMeter){
  container.classList.remove('hide');
  container.innerHTML='<div class="tiny muted">正在检测麦克风权限与设备…</div>';
  vcStop();
  voiceDiag().then(rep=>{
    container.innerHTML='<div class="tiny muted mb8">自检结果</div>'+vcDiagHtml(rep)+
      (withMeter?'<div class="mt12"><div class="prog" style="height:10px"><i id="vcBar" style="width:0%;background:var(--ink3)"></i></div><div class="tiny muted mt8" id="vcLv">对着麦克风说话，测试拾音…</div></div>':'');
    if(withMeter)vcStartMeter($('#vcBar',container),$('#vcLv',container));
  });
}
function voiceSelfCheck(){
  modal({title:'语音输入自检',
    body:'<div id="vcBox"></div>'+
      '<div class="alert info mt12">'+ico('alert')+'<div>Mac 用户注意：浏览器里允许了还不够，<b>系统设置 → 隐私与安全性 → 麦克风</b> 里必须勾选你正在用的浏览器（Chrome/Edge），否则系统不会把声音交给浏览器，表现就是「软件听不见」。<br>安卓用户注意：若自检全部正常却<b>识别不出文字</b>，是浏览器识别服务连不上（国内无 Google 服务），请改用开单页语音窗里的「输入法语音」，或换 Edge / Chrome 打开。</div></div>',
    footer:'<button class="btn" id="vcRe">'+ico('refresh')+'重新检测</button><button class="btn pri" data-mclose>完成</button>',
    mount(sh){
      vcRun($('#vcBox',sh),true);
      $('#vcRe',sh).onclick=()=>vcRun($('#vcBox',sh),true);
      const iv=setInterval(()=>{if(!$('#mask').classList.contains('on')){vcStop();clearInterval(iv)}},300);
    }});
}

function initVoiceFab(){
  if(!Speech.ok)return;
  const b=document.createElement('button');
  b.id='vmic';b.type='button';b.title='语音输入到当前输入框';b.innerHTML=ico('mic');
  document.body.appendChild(b);
  const SEL='input.inp:not([type="date"]):not([disabled]),textarea.inp';
  let target=null,base='',acc='';
  const setV=v=>{if(!target)return;target.value=v;target.dispatchEvent(new Event('input',{bubbles:true}))};
  document.addEventListener('focusin',e=>{
    const t=e.target;
    if(t&&t.matches&&t.matches(SEL)){target=t;b.classList.add('on')}
  });
  document.addEventListener('focusout',()=>{
    setTimeout(()=>{
      const a=document.activeElement;
      if(!a||!a.matches||!a.matches(SEL)){
        target=null;
        if(Speech.live()){Speech.stop()}
        b.classList.remove('rec','on');
      }
    },150);
  });
  b.onclick=()=>{
    if(Speech.live()){Speech.stop();b.classList.remove('rec');return}
    if(!target||!document.body.contains(target)){toast('请先点一下要填写的输入框','warn');return}
    base=target.value;acc='';
    let gotAny=false;const t0=Date.now();
    const ok=Speech.start({
      final:t=>{gotAny=true;acc+=t;setV((base?base+' ':'')+acc)},
      interim:i=>{if(i)gotAny=true;setV((base?base+' ':'')+acc+i)},
      error:er=>{
        if(er==='not-allowed')toast(voiceErrMsg(er),'err');
        else if(er==='service-not-allowed'||er==='network')toast(voiceErrMsg(er)+'；也可点输入框后用输入法（搜狗/百度/微信输入法）键盘上的麦克风语音输入','err');
        else if(er==='no-speech')toast(voiceErrMsg(er),'warn');
        else if(er!=='aborted')toast(voiceErrMsg(er),'err');
      },
      end:()=>{
        b.classList.remove('rec');
        if(!gotAny&&Date.now()-t0>1200)toast('没识别到文字：本浏览器识别服务不可用，可改用输入法键盘上的麦克风语音输入当前框','warn');
      }
    });
    if(ok)b.classList.add('rec');else toast('无法启动语音识别','err');
  };
}

/* ===================================================================
   启动
   =================================================================== */
DB.load();
initVoiceFab();
document.addEventListener('DOMContentLoaded',()=>{
  $('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mask').classList.contains('on'))closeModal()});
  render();
});
if(document.readyState!=='loading'){
  $('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal()});
  render();
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
